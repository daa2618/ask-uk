name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry

      - name: Check the tag matches pyproject.toml
        run: |
          version="$(poetry version --short)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}" >&2
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$1 == "##" { f = ($2 == v); next } f' CHANGELOG.md > notes.md
          if ! grep -q '^- ' notes.md; then
            echo "No CHANGELOG.md section with bullets for ${version}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: poetry install

      - name: Test
        run: poetry run python -m pytest -q

      - name: Build wheel and sdist
        run: poetry build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "ukdatapy ${GITHUB_REF_NAME}" --notes-file notes.md
